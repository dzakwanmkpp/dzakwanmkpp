name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake dari grafik kontribusi
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=%23d4a24c&color_dots=%23161616,%233a2e14,%236b5224,%23a87f35,%23d4a24c

      - name: Beri latar hitam pada gambar
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("dist/github-snake-dark.svg")
          s = p.read_text()
          s = re.sub(r"(<svg[^>]*>)", r'\1<rect x="-1000" y="-1000" width="4000" height="4000" fill="#0a0a0a"/>', s, count=1)
          p.write_text(s)
          PY

      - name: Push ke branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
